# Render Blueprint: static React client + FastAPI/ecCodes API.
# The API cache uses Render's ephemeral filesystem on the Free plan.
services:
  - type: web
    name: rainscope-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: RAINSCOPE_CACHE_DIR
        value: /tmp/rainscope-cache
      - key: ECMWF_SOURCE
        value: ecmwf
      - key: RAINSCOPE_ALLOWED_HOSTS
        fromService:
          name: rainscope-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: RAINSCOPE_CORS_ORIGINS
        fromService:
          name: rainscope-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: rainscope-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: rainscope-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
